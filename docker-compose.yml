services:
  bankguard-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bankguard
      POSTGRES_USER: bankguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bankguard]
      interval: 10s
      retries: 10
    restart: unless-stopped
  bankguard-redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    restart: unless-stopped
  bankguard-api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://bankguard:${POSTGRES_PASSWORD}@bankguard-postgres:5432/bankguard
    depends_on:
      bankguard-postgres:
        condition: service_healthy
    command: [sh, -c, 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000']
    restart: unless-stopped
  bankguard-web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://bankguard-api:8000
    depends_on: [bankguard-api]
    restart: unless-stopped
  bankguard-proxy:
    image: caddy:2-alpine
    environment:
      BANKGUARD_DOMAIN: ${BANKGUARD_DOMAIN:?Set an isolated domain}
    ports: ['80:80', '443:443']
    volumes:
      - ./infra/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [bankguard-web]
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  caddy-data:
